{{ head_extra }}

<body>
  <h1><img class="logo-mark" src="/logo.png?v={{ v }}" alt="" /><span class="wordmark">Cross<span class="crossink-header">I</span>nk</span></h1>

  <div class="nav-links">
    <a href="/"{{ cls_home }}>Home</a>
    <a href="/files"{{ cls_files }}>File Manager</a>
    <a href="/settings"{{ cls_settings }}>Settings</a>
    <a href="/fonts"{{ cls_fonts }}>Fonts</a>
  </div>

{{ body }}

  <p class="footer">CrossInk &bull; Open Source</p>

  <script>
    // Jester (feature 23): give the device the browser's clock so files it writes,
    // including uploads, carry a real date. The X4 has no RTC.
    window.jesterSendClock = function() {
      try {
        const body = new URLSearchParams();
        body.set('epoch', String(Math.floor(Date.now() / 1000)));
        body.set('offset', String(-new Date().getTimezoneOffset()));
        return fetch('/api/time', { method: 'POST', body: body }).catch(function() {});
      } catch (e) {
        return Promise.resolve();
      }
    };
    window.jesterSendClock();
  </script>
{{ script }}
</body>
</html>
